
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Hurricane Sandy Progression - Interactive Viewer</title>
            <style>
                body {
                    font-family: Arial, sans-serif;
                    margin: 0;
                    padding: 20px;
                    background-color: #f0f0f0;
                }
                .container {
                    max-width: 1200px;
                    margin: 0 auto;
                    background-color: white;
                    border-radius: 10px;
                    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                    overflow: hidden;
                }
                .header {
                    background-color: #2c3e50;
                    color: white;
                    padding: 20px;
                    text-align: center;
                }
                .controls {
                    background-color: #34495e;
                    padding: 15px;
                    text-align: center;
                }
                .stage-button {
                    background-color: #3498db;
                    color: white;
                    border: none;
                    padding: 10px 20px;
                    margin: 5px;
                    border-radius: 5px;
                    cursor: pointer;
                    font-size: 14px;
                    transition: background-color 0.3s;
                }
                .stage-button:hover {
                    background-color: #2980b9;
                }
                .stage-button.active {
                    background-color: #e74c3c;
                }
                .stage-info {
                    background-color: #ecf0f1;
                    padding: 15px;
                    text-align: center;
                    border-bottom: 1px solid #bdc3c7;
                }
                .map-container {
                    height: 600px;
                    position: relative;
                }
                .map-frame {
                    display: none;
                    width: 100%;
                    height: 100%;
                    border: none;
                }
                .map-frame.active {
                    display: block;
                }
                .legend {
                    background-color: #f8f9fa;
                    padding: 15px;
                    text-align: center;
                    font-size: 12px;
                    color: #666;
                }
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1>Hurricane Sandy Progression</h1>
                    <p>Interactive Hurricane Progression Viewer</p>
                </div>
                
                <div class="controls">
        
                    <button class="stage-button active" onclick="showStage(0)" id="btn-0">
                        Start
                    </button>
            
                    <button class="stage-button " onclick="showStage(1)" id="btn-1">
                        Approaching (Stage 1)
                    </button>
            
                    <button class="stage-button " onclick="showStage(2)" id="btn-2">
                        Approaching (Stage 2)
                    </button>
            
                    <button class="stage-button " onclick="showStage(3)" id="btn-3">
                        Closest Approach
                    </button>
            
                    <button class="stage-button " onclick="showStage(4)" id="btn-4">
                        End
                    </button>
            
                </div>
                
                <div class="stage-info" id="stage-info">
                    <strong>Stage 1: Start</strong> | Loading...
                </div>
                
                <div class="map-container">
        
                    <iframe src="stage_1_start.html" class="map-frame active" id="map-0"></iframe>
            
                    <iframe src="stage_2_approaching_stage_1.html" class="map-frame " id="map-1"></iframe>
            
                    <iframe src="stage_3_approaching_stage_2.html" class="map-frame " id="map-2"></iframe>
            
                    <iframe src="stage_4_closest_approach.html" class="map-frame " id="map-3"></iframe>
            
                    <iframe src="stage_5_end.html" class="map-frame " id="map-4"></iframe>
            
                </div>
                
                <div class="legend">
                    <p><strong>Legend:</strong> 
                    🟢 Wind Farm Operational | 🔴 Wind Farm Shutdown | 
                    Blue Circles: Safe Distance | Red Circles: Danger Zone
                    </p>
                </div>
            </div>
            
            <script>
                const stageInfo = [{'name': 'Start', 'datetime': '2012-10-21 18:00', 'distance': '2678.8', 'status': 'OPERATIONAL'}, {'name': 'Approaching (Stage 1)', 'datetime': '2012-10-24 12:00', 'distance': '2419.3', 'status': 'OPERATIONAL'}, {'name': 'Approaching (Stage 2)', 'datetime': '2012-10-27 00:00', 'distance': '1218.6', 'status': 'OPERATIONAL'}, {'name': 'Closest Approach', 'datetime': '2012-10-29 21:00', 'distance': '83.5', 'status': 'SHUTDOWN'}, {'name': 'End', 'datetime': '2012-10-31 12:00', 'distance': '626.5', 'status': 'OPERATIONAL'}];
                
                function showStage(stageIndex) {
                    // Hide all maps
                    const maps = document.querySelectorAll('.map-frame');
                    maps.forEach(map => map.classList.remove('active'));
                    
                    // Remove active class from all buttons
                    const buttons = document.querySelectorAll('.stage-button');
                    buttons.forEach(btn => btn.classList.remove('active'));
                    
                    // Show selected map
                    document.getElementById('map-' + stageIndex).classList.add('active');
                    document.getElementById('btn-' + stageIndex).classList.add('active');
                    
                    // Update stage info
                    const info = stageInfo[stageIndex];
                    const statusColor = info.status === 'SHUTDOWN' ? 'red' : 'green';
                    document.getElementById('stage-info').innerHTML = 
                        '<strong>' + info.name + '</strong> | ' +
                        'Time: ' + info.datetime + ' | ' +
                        'Distance: ' + info.distance + ' km | ' +
                        'Status: <span style="color: ' + statusColor + '">' + info.status + '</span>';
                }
                
                // Initialize first stage
                showStage(0);
            </script>
        </body>
        </html>
